<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="A modern social media app UI built with Flutter — feed, stories, notifications, and profiles.">

  <!-- Browser UI colour, matched to the app's Material 3 scheme. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0d6b58">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1513">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quick Social">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quick Social</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Shown while main.dart.js downloads and the engine boots, so the first
      paint is the app's brand rather than a blank white page. Removed on the
      `flutter-first-frame` event.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f5fbf7;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f5fbf7;
      color: #0d6b58;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 250ms ease-out;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #boot-splash span {
      animation: boot-pulse 1.4s ease-in-out infinite;
    }

    @keyframes boot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0f1513; }
      #boot-splash {
        background-color: #0f1513;
        color: #86d6bf;
      }
    }

    /* Respect the reduced-motion preference. */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash span { animation: none; }
      #boot-splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-label="Loading Quick Social">
    <span>QuickSocial</span>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      splash.addEventListener('transitionend', function () {
        splash.remove();
      });
      // Fallback in case the transition never fires (reduced motion, or a
      // background tab that never runs the animation).
      window.setTimeout(function () {
        if (splash.isConnected) splash.remove();
      }, 600);
    });
  </script>
</body>
</html>
